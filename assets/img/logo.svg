<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Gear icon -->
  <g transform="translate(4,4)">
    <circle cx="20" cy="20" r="7.5" fill="none" stroke="#0057b8" stroke-width="2.8"/>
    <!-- 8 gear teeth -->
    <rect x="17.5" y="0"  width="5" height="7"  rx="1.5" fill="#0057b8" transform="rotate(0   20 20)"/>
    <rect x="17.5" y="0"  width="5" height="7"  rx="1.5" fill="#0057b8" transform="rotate(45  20 20)"/>
    <rect x="17.5" y="0"  width="5" height="7"  rx="1.5" fill="#0057b8" transform="rotate(90  20 20)"/>
    <rect x="17.5" y="0"  width="5" height="7"  rx="1.5" fill="#0057b8" transform="rotate(135 20 20)"/>
    <rect x="17.5" y="0"  width="5" height="7"  rx="1.5" fill="#0057b8" transform="rotate(180 20 20)"/>
    <rect x="17.5" y="0"  width="5" height="7"  rx="1.5" fill="#0057b8" transform="rotate(225 20 20)"/>
    <rect x="17.5" y="0"  width="5" height="7"  rx="1.5" fill="#0057b8" transform="rotate(270 20 20)"/>
    <rect x="17.5" y="0"  width="5" height="7"  rx="1.5" fill="#0057b8" transform="rotate(315 20 20)"/>
    <circle cx="20" cy="20" r="5" fill="#0057b8"/>
    <circle cx="20" cy="20" r="2.5" fill="white"/>
  </g>
  <!-- "C++" text mark -->
  <text x="52" y="30" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="22" font-weight="800" fill="#0057b8" letter-spacing="-1">C++</text>
  <!-- "Learning Hub" sub-text -->
  <text x="52" y="43" font-family="-apple-system,Segoe UI,system-ui,sans-serif" font-size="11" font-weight="500" fill="#5a6478" letter-spacing="1.2">LEARNING HUB</text>
</svg>
